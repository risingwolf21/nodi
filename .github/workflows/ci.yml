name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Platzhalter statt Secrets: Ohne Werte wirft src/lib/supabase.ts beim
      # Laden, und der Bundler ließe den Supabase-Client weg. Mit Platzhaltern
      # entspricht das Bundle dem Produktions-Build; ausgeliefert wird es nicht.
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Check GitHub Pages base path
        run: |
          grep -q 'src="/nodi/assets/' dist/index.html \
            || (echo "dist/index.html verwendet nicht den Base-Pfad /nodi/" && exit 1)

      - name: Check PWA output
        run: |
          test -f dist/sw.js || (echo "dist/sw.js fehlt" && exit 1)
          grep -q 'rel="manifest" href="/nodi/manifest.webmanifest"' dist/index.html \
            || (echo "Manifest-Link fehlt oder hat falschen Pfad" && exit 1)
          for icon in pwa-192 pwa-512 maskable-512 apple-touch-icon-180; do
            test -f "dist/icons/$icon.png" || (echo "dist/icons/$icon.png fehlt" && exit 1)
          done

      - name: Check bundle for secret keys
        # supabase-js enthält das Präfix selbst (Formatprüfung), daher nur
        # nach einem Präfix mit Schlüssel dahinter suchen.
        run: |
          ! grep -rlE "sb_secret_[A-Za-z0-9_-]{16,}" dist \
            || (echo "Ein geheimer Supabase-Schlüssel steht im Bundle" && exit 1)

  # Browser tests against a production build with a fake Supabase backend
  # (e2e/fake-supabase.ts): no real server, no secrets.
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  database:
    name: Database migrations & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Startet eine leere lokale Datenbank und wendet alle Migrationen an.
      - name: Start database and apply migrations
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      - name: Run pgTAP tests
        run: supabase test db
