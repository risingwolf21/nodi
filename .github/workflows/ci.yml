name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ohne Supabase-Secrets: Der Build prüft nur Typen und Bundling,
      # das Ergebnis wird nicht ausgeliefert.
      - name: Build application
        run: npm run build

      - name: Check GitHub Pages base path
        run: |
          grep -q 'src="/nodi/assets/' dist/index.html \
            || (echo "dist/index.html verwendet nicht den Base-Pfad /nodi/" && exit 1)

  database:
    name: Database migrations & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Startet eine leere lokale Datenbank und wendet alle Migrationen an.
      - name: Start database and apply migrations
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      - name: Run pgTAP tests
        run: supabase test db
