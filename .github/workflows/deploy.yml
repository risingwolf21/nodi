
name: Deploy Nodi to GitHub Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deploys nicht abbrechen: Ein abgebrochener Migrations-Job könnte
# die Datenbank in einem Zwischenstand hinterlassen. Neue Läufe warten.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Reihenfolge: build und verify-database → migrate → deploy. Erst wenn
  # Frontend und Migrationen geprüft sind, wird die Datenbank geändert;
  # sonst liefe ein neues Schema mit einem Frontend, das nie deployt wird.
  # Migrationen müssen mit dem noch laufenden alten Frontend kompatibel
  # sein (siehe CLAUDE.md §9).
  verify-database:
    name: Verify migrations on a fresh database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start database and apply migrations
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --fail-on error

      - name: Run pgTAP tests
        run: supabase test db

  migrate:
    name: Apply database migrations
    needs: [build, verify-database]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN fehlt" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD fehlt" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "SUPABASE_PROJECT_ID fehlt" && exit 1)

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: supabase migration list

      # Wendet nur Migrationen an, die in der Remote-Historie fehlen.
      # Bricht ab, wenn die Remote-Historie nicht zu supabase/migrations passt.
      - name: Push migrations
        run: supabase db push --yes

  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "VITE_SUPABASE_URL fehlt" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "VITE_SUPABASE_PUBLISHABLE_KEY fehlt" && exit 1)
          # The key ends up in the public bundle: never a secret key.
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*)
              echo "VITE_SUPABASE_PUBLISHABLE_KEY ist ein geheimer Schlüssel (sb_secret_); nur den Publishable Key verwenden" && exit 1 ;;
          esac
          # Legacy JWT keys: the service_role key must never reach the browser.
          if [ "$(printf '%s' "$VITE_SUPABASE_PUBLISHABLE_KEY" | tr -cd '.' | wc -c)" -eq 2 ]; then
            role=$(python3 -c 'import base64, json, os; p = os.environ["VITE_SUPABASE_PUBLISHABLE_KEY"].split(".")[1]; print(json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))).get("role", ""))')
            test "$role" != "service_role" \
              || (echo "VITE_SUPABASE_PUBLISHABLE_KEY ist der Service-Role-Key; nur den anon/Publishable Key verwenden" && exit 1)
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check GitHub Pages base path
        run: |
          grep -q 'src="/nodi/assets/' dist/index.html \
            || (echo "dist/index.html verwendet nicht den Base-Pfad /nodi/" && exit 1)

      # Der echte Produktions-Build, mit den Werten aus den Secrets.
      - name: Check bundle for secret keys
        # supabase-js enthält das Präfix selbst (Formatprüfung), daher nur
        # nach einem Präfix mit Schlüssel dahinter suchen.
        run: |
          ! grep -rlE "sb_secret_[A-Za-z0-9_-]{16,}" dist \
            || (echo "Ein geheimer Supabase-Schlüssel steht im Bundle" && exit 1)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, migrate]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
